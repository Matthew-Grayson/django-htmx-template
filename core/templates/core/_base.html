{% load django_htmx %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django HTMX Template{% endblock %}</title>
    {% htmx_script %}
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        line-height: 1.6;
      }
      h1 {
        color: #0c4b33;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
        background-color: #f9f9f9;
      }
      button {
        background-color: #0c4b33;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #0a3d29;
      }
      #response, #activity {
        margin-top: 20px;
        padding: 15px;
        border-radius: 4px;
        background-color: #e8f5e9;
      }
      form p label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      form input[type="text"],
      form input[type="password"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .helptext {
        display: block;
        font-size: 0.9em;
        color: #666;
        margin-top: 5px;
      }
      .errorlist {
        color: #d32f2f;
        list-style: none;
        padding: 0;
        margin: 5px 0;
      }
      a {
        color: #0c4b33;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% block content %}
    {% endblock %}
  </body>
</html>
